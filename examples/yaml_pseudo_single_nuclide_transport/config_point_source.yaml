project_name: PseudoPointSource
create_python_bc: False
python_bc_source_value: 0.0
create_meshes: True
mesh_dimension: 1
quantity_of_interests:
  - concentration
  - Flux
source:
  type: point
  loc: 0.0
process_variables:
  - pressure
  - concentration
secondary_variables:
  - Flux
initial_condition_nuclide:
  type:
    - Constant
  value:
    - 1.0
boundary_condition_nuclide:
  type:
    - Dirichlet
  mesh:
    - point_top
  value:
    - 0.0
pressure_setup:
  # pressure_bottom solves Darcy's law, q = -(kappa/mu)*(dP/dx - rho_f*g),
  # for a target darcy flux of 1 mm/yr
  pressure_initial: 100000.0
  pressure_top: 100000.0
  pressure_bottom: -15645977.407014478
decay: true
diffusion: true
advection: true
sorption: true
sim_setup:
  timeloop:
    processes:
      nonlinear_solver_name: basic_picard
      convergence_type: PerComponentDeltaX
      norm_type: NORM2
      time_discretization: BackwardEuler
      time_stepping:
        type: FixedTimeStepping
        t_initial: 0.0
        t_end: 31557600000000.0
        time_step:
        - 31557600.0
        - 315576000.0
        - 3155760000.0
        - 31557600000.0
        - 315576000000.0
        repeat:
        - 100
        - 90
        - 90
        - 90
        - 90
    output:
      repeat:
      - '10'
      - '9'
      - '9'
      - '9'
      - '9'
      each_steps:
      - '10'
      - '10'
      - '10'
      - '10'
      - '10'
  non_linear_solver:
    name: basic_picard
    type: Picard
    max_iter: '10'
    linear_solver: general_linear_solver
  linear_solver:
    name:
    - general_linear_solver
    - general_linear_solver
    - general_linear_solver
    kind:
    - lis
    - eigen
    - petsc
    prefix:
    - null
    - null
    - hc
    solver_type:
    - cg
    - SparseLU
    - bcgs
    precon_type:
    - jacobi
    - ILUT
    - bjacobi
    max_iteration_step:
    - '20000'
    - '10000'
    - '20000'
    error_tolerance:
    - 1e-16
    - 1e-14
    - 1e-8
